name: Scrape Colorado bills
on:
  schedule:
    # GitHub Actions runs in UTC. Mountain time is UTC-6 in summer
    # (MDT) and UTC-7 in winter (MST).
    - cron: "0 12 * * *"   # 12:00 UTC = 6 a.m. MDT (Mar - Nov)
    - cron: "0 23 * * *"   # 23:00 UTC = 5 p.m. MDT (Mar - Nov)
    # - cron: "0 13 * * *"   # 13:00 UTC = 6 a.m. MST (Nov - Mar)
    # - cron: "0 0  * * *"   # 00:00 UTC = 5 p.m. MST (Nov - Mar, prev day)
  workflow_dispatch:       # allows manual runs from the Actions tab
permissions:
  contents: write          # needed to commit the updated CSV
concurrency:
  group: scrape-co-bills
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run scraper
        id: scrape
        # Don't fail the whole workflow on partial failure (exit 2);
        # we still want to commit whatever we got. A hard failure
        # (exit 1, no rows at all) does fail the run.
        run: |
          set +e
          python scrape_bills.py co_bills_2026.csv
          status=$?
          set -e
          echo "scrape_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "Scrape completed cleanly."
          elif [ "$status" -eq 2 ]; then
            echo "::warning::Scrape completed with partial failures (some bills missing long title or subjects)."
          else
            echo "::error::Scrape failed with exit code $status."
            exit "$status"
          fi
      - name: Commit updated CSV if changed
        if: steps.scrape.outputs.scrape_status != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add co_bills_2026.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            STAMP=$(TZ=America/Denver date +'%Y-%m-%d %H:%M %Z')
            git commit -m "Scheduled scrape: $STAMP"
            git push
          fi
      - name: Upload debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tfa-debug-html
          path: |
            tfa_debug.html
            tfa_debug_rendered.html
          if-no-files-found: ignore